[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Functions ────────────────────────────────────────────────────────────
[functions]
  node_bundler = "nft"

# ── Redirects ────────────────────────────────────────────────────────────

# 1. Playlist serve — splat matches the full path including .m3u extension
[[redirects]]
  from   = "/api/playlist/*"
  to     = "/.netlify/functions/playlist"
  status = 200
  force  = true

# 2. M3U proxy
[[redirects]]
  from   = "/api/m3u-proxy"
  to     = "/.netlify/functions/m3u-proxy"
  status = 200
  force  = true

# 3. All other API calls
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# 4. SPA fallback — must be LAST
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
