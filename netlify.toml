[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Functions ────────────────────────────────────────────────────────────
[functions]
  node_bundler = "esbuild"

# ── Redirects ────────────────────────────────────────────────────────────

# 1. Playlist serve — matches /api/playlist/<slug>.m3u
#    The splat (*) is used instead of :slug so the .m3u extension is included
#    in the match. The full path (including .m3u) is forwarded to the function
#    via event.path where the slug is extracted by regex.
[[redirects]]
  from   = "/api/playlist/*"
  to     = "/.netlify/functions/playlist"
  status = 200

# 2. All other API calls → matching function by name
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# 3. SPA fallback — must be LAST
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
